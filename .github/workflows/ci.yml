name: CI - Validar y ejecutar con Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

      - name: Construir la imagen Docker
        run: docker build -t app-caso2:${{ github.sha }} .

      - name: Ejecutar el contenedor
        run: docker run --rm app-caso2:${{ github.sha }}